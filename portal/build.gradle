plugins {
    id 'java'
}

version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        name = 'modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'bluecolored'
        url = 'https://repo.bluecolored.de/releases'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.121-stable'
    compileOnly 'de.bluecolored:bluemap-api:2.8.1'
    compileOnly 'com.flowpowered:flow-math:1.0.3'
    compileOnly 'maven.modrinth:pl3xmap:26.2-556'
}
