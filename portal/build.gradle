plugins {
    id 'java'
}

version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'bluecolored'
        url = 'https://repo.bluecolored.de/releases'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.121-stable'
    compileOnly 'de.bluecolored:bluemap-api:2.8.1'
}
