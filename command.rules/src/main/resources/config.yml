# Server Rules Configuration
title: "Server Rules and Info"
accept-button: "I have read and accepted the rules"
close-button: "Close"
# The rules text that will be displayed in the GUI
# Use | for multi-line text
body:
  - paragraph: "Welcome to our server"
  - paragraph: "✖ Rule 1"
    color: RED
  - paragraph: "✔ Rule 2"
    color: GREEN

# Global welcome message shown when a player accepts the rules for the first time
# Use {player} for the player's name
welcome-message: "<green>Welcome <player>! Thank you for accepting the rules. Enjoy your stay!</green>"