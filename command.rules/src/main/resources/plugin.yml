main: strelitzia.saddle.command.rules.RulesPlugin
name: saddle.rules
version: 1.0.1
api-version: "26.2"
folia-supported: true
author: Strelitzia
description: Display server rules with a full-screen GUI
commands:
  rules:
    description: View server rules
    permission: rules.use
    usage: /rules [reload]
permissions:
  rules.use:
    description: Allows use of the /rules command
    default: true
  rules.reload:
    description: Allows use of the /rules reload command
    default: op
  rules.reset:
    description: Allows use of the /rules reset command
    default: op